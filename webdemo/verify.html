:root{
  --paper:#F2F4F7;   /* cool security paper */
  --well:#E6EAF0; --field:#FFFFFF;
  --ink:#1C2B4A;     /* blueprint ink: headings, the answer */
  --text:#2E3646; --muted:#566072; --rule:#D3D9E2;
  --cobalt:#2647B8; --cobalt-wash:#E4EAFA;   /* verified */
  --void:#B4233A;   --void-wash:#F8E4E7;     /* broken / tampered */
  --sans:"Atkinson Next","Segoe UI",system-ui,sans-serif;
  --mono:"Atkinson Mono",ui-monospace,Consolas,monospace;
  --r-ctl:6px; --r-panel:10px;
  --rail:212px; --gap:64px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--cobalt);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px;border-radius:var(--r-ctl)}
button{font:inherit;color:inherit}

/* ---------- layout: rail + content ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:64px 32px 180px;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--gap);align-items:start}
.top{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px}
h1{font:700 21px/1.15 var(--sans);letter-spacing:-.01em;margin:0;color:var(--ink)}
.top p{margin:0;font-size:14px;line-height:1.45;color:var(--muted);max-width:22ch}
.file{align-self:flex-start;font:500 14px var(--sans);color:var(--cobalt);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.main{min-width:0;max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:56px}
.chip{font-size:14px;color:var(--text);background:var(--well);border-radius:var(--r-ctl);padding:6px 11px;cursor:pointer;line-height:1.35}
.chip:hover{background:var(--cobalt-wash);color:var(--ink)}
.turn{margin-bottom:96px}
.q{font-size:14px;color:var(--muted);margin-bottom:10px}
.a{font:500 clamp(30px,4.2vw,42px)/1.12 var(--sans);letter-spacing:-.022em;color:var(--ink);margin:0 0 22px;max-width:24ch}
.a.idk{color:var(--muted);font-weight:400}
.loading{display:inline-flex;gap:6px;padding:20px 0}
.loading i{width:14px;height:8px;border:2px solid var(--muted);border-radius:4px;animation:blink 1.2s steps(1) infinite}
.loading i:nth-child(2){animation-delay:.2s}.loading i:nth-child(3){animation-delay:.4s}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cite{font:500 13px var(--mono);color:var(--ink);cursor:pointer;background:var(--well);border-radius:4px;padding:2px 7px}
.cite:hover{background:var(--cobalt-wash)}
.cite.on{background:var(--cobalt);color:#fff}
.sp{flex:1}
.btn{font:600 14px/1 var(--sans);border:0;background:var(--cobalt);color:#fff;border-radius:var(--r-ctl);padding:10px 18px;cursor:pointer}
.btn:hover{background:var(--ink)}
.icon{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;font:500 14px var(--sans)}
.icon:hover{color:var(--ink)}
.menu{display:none;gap:6px;flex-wrap:wrap}
.menu.on{display:inline-flex}
.menu span{cursor:pointer;font-size:13px;color:var(--void);background:var(--void-wash);border-radius:4px;padding:2px 8px}
.menu span:hover{background:var(--void);color:#fff}
.ptext{font-size:16px;line-height:1.65;color:var(--text);margin:20px 0 0;padding:14px 18px;background:var(--field);border-radius:var(--r-panel);white-space:pre-wrap;max-width:68ch}

/* ---------- the custody chain ---------- */
.flow{margin-top:44px;display:flex;align-items:center}
.col{display:flex;flex-direction:column;gap:18px;align-items:center}
.link{flex:1;height:4px;min-width:16px;background:var(--rule);border-radius:2px;position:relative;overflow:hidden;margin:0 -34px 45px;z-index:0}
.link::after{content:"";position:absolute;inset:0;background:var(--cobalt);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.link.ok::after{transform:scaleX(1)}
.link.bad{background:none}
/* fork / join around a column of several sources */
.col.multi{position:relative;padding:0 12px}
.col.multi::before,.col.multi::after{content:"";position:absolute;top:18px;bottom:64px;width:4px;border-radius:2px;background:var(--rule)}
.col.multi::before{left:0}.col.multi::after{right:0}
.col.multi .node::before{content:"";position:absolute;top:18px;height:4px;left:-12px;right:-12px;background:var(--rule);z-index:-1}
.col.multi.ok::before,.col.multi.ok::after,.col.multi .node.ok::before{background:var(--cobalt)}
.col.multi .node.bad::before{background:repeating-linear-gradient(90deg,var(--void) 0 5px,transparent 5px 10px)}
.col.multi.bad::after{background:repeating-linear-gradient(180deg,var(--void) 0 5px,transparent 5px 10px)}
.col.multi.bad::before{background:var(--cobalt)}
.link:has(+ .col.multi){margin-right:0}
.col.multi + .link{margin-left:0}
.link.bad::after{background:repeating-linear-gradient(90deg,var(--void) 0 5px,transparent 5px 10px);transform:scaleX(1)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;width:92px;padding:6px 0;border-radius:var(--r-panel);border:0;background:none}
.node.wide{width:150px}
.node.sel{background:var(--well)}
.node:hover .lbl{color:var(--cobalt)}
.g{width:46px;height:28px;overflow:visible}
.g .ring{fill:var(--paper);stroke:var(--muted);stroke-width:2.5}
.g .gap{fill:none}
.node.wait .g .ring{stroke-dasharray:4 4;animation:crawl 1s linear infinite}
.node.ok .g .ring{fill:var(--cobalt);stroke:var(--cobalt)}
.node.bad .g .ring{fill:var(--void-wash);stroke:var(--void);stroke-width:2.5}
.node.bad .g .gap{fill:var(--paper)}           /* the link is broken open */
.g .mk{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .4s var(--ease) .05s}
.node.ok .g .mk{stroke:#fff}
.node.bad .g .mk{stroke:var(--void)}
.node.ok .g .mk,.node.bad .g .mk{stroke-dashoffset:0}
.lbl{font:600 14px/1.2 var(--sans);color:var(--ink)}
.sub{font:400 12px/1.25 var(--sans);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.node.bad .sub{color:var(--void)}
.why{margin-top:30px;font:600 16px/1.4 var(--sans);color:var(--void);min-height:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.why.okk{color:var(--cobalt)}
.why svg{flex:none}
.how{font-size:13px;line-height:1.5;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;line-height:1.5;color:var(--ink);margin-top:2px}
.hint:empty{display:none}
.tag{font:500 12px var(--sans);color:var(--void);background:var(--void-wash);border-radius:4px;padding:1px 8px;line-height:20px}

/* ---------- evidence ---------- */
.det{margin-top:28px;background:var(--field);border-radius:var(--r-panel);padding:6px 22px 18px;font-size:14px}
.det h4{font:700 14px var(--sans);color:var(--ink);margin:22px 0 10px}
.det h4 small{font:400 13px var(--sans);color:var(--muted);margin-left:8px}
.ck{display:grid;grid-template-columns:18px 1fr;gap:0 6px;padding:3px 0;color:var(--text);font-size:14px;line-height:1.45}
.ck i{width:12px;height:8px;border-radius:4px;margin-top:6px;background:var(--cobalt)}
.ck.bad i{background:var(--void-wash);border:2px solid var(--void);border-left-color:transparent}
.ck.bad{color:var(--void)}
.ck.skip i{background:none;border:2px dashed var(--muted)}
.ck.skip{color:var(--muted)}
.ck .d{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.ev{margin:0 0 16px}
.ev .hd{display:flex;align-items:baseline;gap:10px;color:var(--text);font-size:14px;margin-bottom:4px}
.verdict{margin-left:auto;font:600 13px var(--sans);white-space:nowrap}
.verdict.ok{color:var(--cobalt)}.verdict.bad{color:var(--void)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:2px 14px;font:400 13px/1.6 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border-radius:var(--r-ctl);padding:8px 12px}
.kv>.k{font:400 13px/1.6 var(--sans);color:var(--muted);text-align:right}
.kv>.v{word-break:break-all;min-width:0}
.hx span{margin-right:.4em}.hx span:last-child{margin-right:0}
.hx b{font-weight:700;color:var(--void);background:var(--void-wash);border-radius:2px}
.kv .note{font:400 13px var(--sans);color:var(--muted)}
.cmdline{display:flex;gap:10px;align-items:baseline}
.cmdline code{flex:1;font:400 13px/1.55 var(--mono);color:var(--text);word-break:break-all}
.cmdline code::before{content:"$ ";color:var(--muted)}
.copy{font:500 13px var(--sans);color:var(--cobalt);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.rpcs{border-radius:var(--r-ctl);overflow:hidden;background:var(--paper)}
.rpc+.rpc{border-top:1px solid var(--rule)}
.rpc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:26px auto 1fr 58px 14px;gap:12px;align-items:baseline;padding:8px 12px;font:400 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.rpc summary::-webkit-details-marker{display:none}
.rpc summary .n,.rpc summary .s,.rpc summary .ms,.rpc summary .t{color:var(--muted)}
.rpc summary .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpc summary .ms{text-align:right}
.rpc summary .t{text-align:center;font-family:var(--sans)}
.rpc summary .t::before{content:"+"}
.rpc[open] summary .t::before{content:"\2212"}
.rpc summary:hover .m{color:var(--cobalt)}
.rpc .x{display:grid;grid-template-columns:84px 1fr;gap:10px 14px;padding:4px 12px 16px}
.rpc .x>.k{font:400 13px/1.9 var(--sans);color:var(--muted);text-align:right}
.rpc pre{margin:0;max-height:200px;overflow:auto;background:var(--field);border-radius:var(--r-ctl);padding:9px 12px;font:400 12px/1.6 var(--mono);color:var(--text);white-space:pre-wrap;word-break:break-all}
.rpc .cast{background:var(--field);border-radius:var(--r-ctl);padding:8px 12px}
.rk{display:grid;grid-template-columns:30px minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr);gap:0 14px;font:400 13px/1.9 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--paper);border-radius:var(--r-ctl);padding:4px 12px}
.rk>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .th{font:400 13px/2 var(--sans);color:var(--muted)}
.rk .n,.rk .s{color:var(--muted)}
.rk .ok{color:var(--cobalt);font-family:var(--sans)}
.rk .bad{color:var(--void);font-family:var(--sans);font-weight:700}
.more{font-size:13px;color:var(--muted);margin-top:6px}

/* ---------- ask bar, drop zone ---------- */
.ask{position:fixed;left:0;right:0;bottom:0;padding:14px 32px 22px;background:var(--paper)}
.ask form{max-width:1140px;margin:0 auto;padding-left:calc(var(--rail) + var(--gap) + 32px);padding-right:32px;position:relative}
.ask .in{position:relative;max-width:760px}
.ask input{width:100%;font:400 16px var(--sans);color:var(--ink);padding:14px 60px 14px 18px;border:2px solid var(--rule);border-radius:var(--r-panel);background:var(--field);outline:none}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:var(--cobalt)}
.ask button{position:absolute;right:7px;top:7px;width:38px;height:38px;border-radius:var(--r-ctl);border:0;background:var(--cobalt);color:#fff;cursor:pointer;display:grid;place-items:center}
.ask button:hover{background:var(--ink)}
.ask button:disabled{opacity:.4}
.err{color:var(--void);font-size:14px}
.drop{position:fixed;inset:16px;background:rgba(242,244,247,.95);display:none;place-items:center;font:600 22px var(--sans);color:var(--ink);z-index:9;border:3px dashed var(--cobalt);border-radius:var(--r-panel)}
.drop.on{display:grid}
.zone{border:2px dashed var(--rule);border-radius:var(--r-panel);padding:56px 24px;text-align:center;color:var(--ink);cursor:pointer;font:500 19px/1.4 var(--sans);background:var(--field)}
.zone:hover{border-color:var(--cobalt)}
.zone .how{font-weight:400}

/* ---------- narrow screens: rail on top, chain runs downward ---------- */
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;gap:28px;padding:32px 18px 150px}
  .top{position:static;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
  .top p{display:none}
  .ask{padding:12px 14px 16px}
  .ask form{padding:0}
  .flow{flex-direction:column;align-items:center}
  .col{flex-direction:row;gap:12px}
  .link{flex:none;width:4px;height:22px;min-width:0;margin:-4px 0}
  .link::after{transform:scaleY(0);transform-origin:top}
  .link.ok::after{transform:scaleY(1)}
  .link.bad::after{background:repeating-linear-gradient(180deg,var(--void) 0 5px,transparent 5px 10px)}
  .node,.node.wide{width:auto;min-width:96px;padding:6px 8px}
  .col.multi{padding:0}.col.multi::before,.col.multi::after,.col.multi .node::before{display:none}
  .det{padding:4px 14px 14px}
  .kv,.rpc .x{grid-template-columns:64px 1fr}
  .rpc summary{grid-template-columns:22px auto 1fr 14px}.rpc summary .ms{display:none}
}
@keyframes crawl{to{stroke-dashoffset:-16}}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Verify an answer</h1><p>Runs in this page. It talks only to rpc.testnet.arc.io and fetches the replay files from raw.githubusercontent.com, hash-checked.</p></header>
  <main class="main"><div class="zone" id="zone">Drop an answer bundle here, or choose a file</div>
  <div id="thread" style="margin-top:48px"></div></main>
</div>
<div class="drop" id="drop">Drop to verify</div>

  // ---------- canonical JSON exactly like Python json.dumps(sort_keys, (",",":"), ensure_ascii=False) ----------

  // ---------- cast / explorer helpers ----------
  function castFor(method, params, rpc) {

    if (method === "eth_getCode") return `cast code ${params[0]}${R}`;
    if (method === "eth_getTransactionByHash") return `cast tx ${params[0]}${R}`;
    if (method === "eth_getTransactionReceipt") return `cast receipt ${params[0]}${R}`;
    if (method === "eth_getBlockByNumber") return `cast block ${parseInt(params[0], 16)}${R}`;

    for (const r of items.filter((x) => x.kind === "replay")) {
      h += `<h4>Replay <small>committed retriever, rerun in your browser</small></h4>`;
      if (r.error) { h += `<div class="ev"><div class="hd">could not fetch the committed corpus from ${esc(new URL(r.uri).host)}<span class="verdict bad">not run</span></div><div class="kv"><span class="k">run locally</span><span class="v">${cmdRow("python verify_citations.py bundle.json")}</span></div></div>`; continue; }
      const src = r.uri.match(/github(?:usercontent)?\.com\/([^/]+\/[^/]+)\/([0-9a-f]{7})/);
      h += `<div class="ev"><div class="kv">${(r.arts || []).map((a) => `<span class="k">${esc(a.name.replace("retriever code", "code").replace("model weights", "weights"))}</span><span class="v"><a target="_blank" rel="noopener" href="${esc(a.url)}">${esc(a.url.split("/").pop())}</a> <span class="note">${mb(a.bytes)}, sha256 ${short(a.sha256)} ${a.ok ? "≡ committed" : "≠ committed"}</span></span>`).join("")}
        <span class="k">source</span><span class="v note">${src ? `${esc(src[1])} at commit ${esc(src[2])}, pinned by the on-chain URI` : esc(r.uri)}</span></div></div>`;
      if (r.rows) { const show = r.rows.filter((x, i) => i < 8 || !x.same);
        h += `<div class="ev"><div class="hd">${r.rows.length} candidates replayed in ${r.ms} ms<span class="verdict ${r.ok ? "ok" : "bad"}">${r.ok ? "≡ identical ranking" : "≠ ranking differs"}</span></div><div class="rk">
          <span class="th">#</span><span class="th">replayed</span><span class="th">bm25 / dense</span><span class="th">in the answer</span>` +
          show.map((x) => `<span class="n">${x.rank}</span><span class="v">${short(x.id)}</span><span class="s">${x.replay.bm25 ?? "–"} / ${x.replay.dense ?? "–"}</span><span class="${x.same ? "ok" : "bad"}">${x.same ? "≡ same" : (r.missing.includes(x.id) ? "omitted" : short((x.committed || {}).id || "—"))}</span>`).join("") +
          `</div>${r.rows.length > show.length ? `<div class="more">+ ${r.rows.length - show.length} more, all identical</div>` : ""}</div>`; }
    }
    return h;
  }

  // ---------- verify (in the browser) ----------
  function nodeHTML(n) { return `<div class="node wait${n.wide ? " wide" : ""}" data-k="${n.k}" role="button" tabindex="0" title="Show on-chain evidence">${LINK()}<div class="lbl">${esc(n.lbl)}</div><div class="sub">${esc(n.sub)}</div></div>`; }
  async function verify(body, b, tampered) {
    body.querySelector(".ptx").innerHTML = "";
    const vf = body.querySelector(".vf"), cols0 = build(b, null);
    vf.innerHTML = `<div class="flow">${cols0.map((c, i) => (i ? `<div class="link" data-l="${i}"></div>` : "") + `<div class="col${c.length > 1 ? " multi" : ""}" data-c="${i}">${c.map(nodeHTML).join("")}</div>`).join("")}</div>
      <div class="why"></div><div class="how"></div><div class="hint"></div><div class="det"></div>`;
    vf.querySelector(".det").style.display = "none";
    const t0 = performance.now(); let v;
    const how = vf.querySelector(".how");
    try { v = await A().verifyBundle(b, { onStatus: (m) => (how.textContent = b.retrieval ? `Replaying retrieval: ${m} from the committed URI…` : "") }); }
    catch (e) { vf.querySelector(".why").textContent = "could not reach the Arc RPC from your browser: " + e.message;
      vf.querySelector(".how").textContent = "verify offline-of-us instead: python verify_citations.py bundle.json  (or the cast commands in the README)"; return; }
    const mine = location.origin && location.origin !== "null"
      ? performance.getEntriesByType("resource").filter((e) => e.startTime >= t0 && new URL(e.name).origin === location.origin).length : 0;
    const cols = build(b, v), byk = Object.fromEntries(cols.flat().map((n) => [n.k, n])), det = vf.querySelector(".det");
    vf.querySelectorAll(".node").forEach((el) => (el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); el.click(); } }));
    vf.querySelectorAll(".node").forEach((el) => (el.onclick = () => {
      const same = det.dataset.k === el.dataset.k && det.style.display !== "none";
      vf.querySelectorAll(".node").forEach((o) => o.classList.remove("sel"));
      if (same) { det.style.display = "none"; det.dataset.k = ""; return; }
      el.classList.add("sel"); det.dataset.k = el.dataset.k; det.style.display = ""; det.innerHTML = evidenceHTML(byk[el.dataset.k], v);
      det.querySelectorAll("[data-copy]").forEach((c) => (c.onclick = (e) => { e.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy); c.textContent = "copied"; setTimeout(() => (c.textContent = "copy"), 1200); }));
    }));
    let bad = null;
    for (let i = 0; i < cols.length; i++) {
      if (i) { vf.querySelector(`[data-l="${i}"]`).classList.add(cols[i - 1].every((n) => n.ok) ? "ok" : "bad"); await sleep(300); }
      for (const n of cols[i]) { const el = vf.querySelector(`[data-k="${n.k}"]`); el.classList.remove("wait"); el.classList.add(n.ok ? "ok" : "bad");
        el.querySelector(".mk").setAttribute("d", n.ok ? MARK.ok : MARK.bad); el.setAttribute("aria-label", `${n.lbl}: ${n.ok ? "verified" : "failed"}`);
        if (!n.ok && n.src) el.querySelector(".sub").textContent = "not verified";
        if (n.k === "m") el.querySelector(".sub").textContent = n.sub;
        if (n.k === "c" && n.skipped) el.querySelector(".sub").textContent = "run replay locally";
        if (!n.ok && !bad) bad = n; await sleep(200); }
      vf.querySelector(`[data-c="${i}"]`).classList.add(cols[i].every((n) => n.ok) ? "ok" : "bad");
    }
    const why = vf.querySelector(".why");
    if (bad) { why.className = "why"; why.innerHTML = SEAL(false) + `<span>${esc(bad.why)}</span>` + (tampered ? `<span class="tag">tampered ${esc(b._t || "copy")}</span>` : ""); }
    else { why.className = "why okk"; why.innerHTML = SEAL(true) + `<span>${v.all_pass ? "Verified on Arc" : "Model call verified, but no sources were cited"}</span>`; }
    vf.querySelector(".hint").textContent = "Click a node to see the on-chain evidence.";
    G.__lastVerify = v;
    vf.querySelector(".how").textContent = `Checked in your browser, directly against ${new URL(v.rpc).host}: ${v.rpc_calls} RPC calls, ${mine} to our server${b.retrieval ? `; replay files from ${(v.evidence.corpus || []).some((x) => x.kind === "replay" && x.arts) ? "raw.githubusercontent.com, sha256-checked" : "—"}` : ""}.`;
    return v;
  }

  // ---------- open a bundle file ----------
  function loadBundle(thread, file, onDone) {
    const r = new FileReader();
    r.onload = async () => { let b; const t = newTurn(thread, file.name);
      try { b = JSON.parse(r.result); if (!b.contract || !Array.isArray(b.citations)) throw new Error("not an answer bundle"); }
      catch (e) { t.querySelector(".body").innerHTML = `<div class="err">${esc(file.name)}: ${esc(e.message)}</div>`; return; }
      t.querySelector(".q").textContent = b.question || file.name;
      const body = render(t, b, { download: false }); const v = await verify(body, b, false); if (onDone) onDone(v); };
    r.readAsText(file);
  }
  function initFileInput(thread, button, dropEl) {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none"; document.body.appendChild(inp);
    inp.onchange = () => { if (inp.files[0]) loadBundle(thread, inp.files[0]); inp.value = ""; };
    if (button) button.onclick = () => inp.click();
    let depth = 0;
    addEventListener("dragenter", (e) => { e.preventDefault(); depth++; dropEl.classList.add("on"); });
    addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; dropEl.classList.remove("on"); } });
    addEventListener("dragover", (e) => e.preventDefault());
    addEventListener("drop", (e) => { e.preventDefault(); depth = 0; dropEl.classList.remove("on"); const f = e.dataTransfer.files[0]; if (f) loadBundle(thread, f); });
    return inp;
  }

  G.VUI = { newTurn, render, verify, loadBundle, initFileInput, esc };
})(globalThis);

</script>
<script>
VUI.initFileInput(document.getElementById("thread"), document.getElementById("zone"), document.getElementById("drop"));
</script>
</body>
</html>
