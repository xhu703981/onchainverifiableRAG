<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifiable RAG</title>
<link rel="preload" href="/static/fonts/newsreader-opsz.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/plex-sans-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>
<div class="wrap">
  <div class="top"><h1><b>Verifiable</b> RAG</h1><button class="file" id="file" title="Verify a downloaded bundle, entirely in your browser">verify a file</button></div>
  <div class="chips" id="chips"></div>
  <div id="thread"></div>
</div>
<div class="drop" id="drop">Drop a bundle to verify it in your browser</div>
<div class="ask"><form id="f"><input id="q" placeholder="Ask anything…" autocomplete="off"><button id="go" aria-label="Ask">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form></div>
<script src="/static/noble-hashes.min.js"></script>
<script src="/static/replay.js"></script>
<script src="/static/arcverify.js"></script>
<script src="/static/ui.js"></script>
<script>
const $ = (s) => document.querySelector(s), thread = $("#thread");
VUI.initFileInput(thread, $("#file"), $("#drop"));
fetch("/api/samples").then((r) => r.json()).then((s) => {
  s.filter((x) => x.answerable).sort(() => Math.random() - 0.5).slice(0, 4).forEach((x) => {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = x.question; c.onclick = () => { $("#q").value = x.question; ask(); }; $("#chips").appendChild(c); });
});
$("#f").onsubmit = (e) => { e.preventDefault(); ask(); };
async function ask() {
  const q = $("#q").value.trim(); if (!q) return; $("#q").value = ""; $("#go").disabled = true; $("#chips").style.display = "none";
  const t = VUI.newTurn(thread, q);
  try { const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || r.status); VUI.render(t, j.bundle);
  } catch (e) { t.querySelector(".body").innerHTML = `<div class="err">${VUI.esc(e.message)}</div>`; }
  $("#go").disabled = false;
}
/* ?demo=answer|cite|verify|tamper|model|hide|corpus|evidence renders the saved example bundle without spending anything */
const demo = new URLSearchParams(location.search).get("demo");
if (demo) fetch("/api/example").then((r) => r.json()).then(async (b) => {
  $("#chips").style.display = "none";
  const t = VUI.newTurn(thread, b.question), body = VUI.render(t, b);
  if (demo === "cite") body.querySelector(".cite").click();
  if (demo === "verify") VUI.verify(body, b, false);
  if (demo === "tamper") VUI.verify(body, ArcVerify.tamper(b, "char"), true);
  if (demo === "model") VUI.verify(body, ArcVerify.tamper(b, "model"), true);
  if (demo === "hide") VUI.verify(body, ArcVerify.tamper(b, "hide"), true);
  if (demo === "corpus") { await VUI.verify(body, b, false); body.querySelector('[data-k="c"]').click(); }
  if (demo === "evidence") { await VUI.verify(body, b, false); body.querySelector('[data-k="s0"]').click(); body.querySelector(".rpc").open = true; }
});
</script>
</body>
</html>
