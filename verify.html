:root{
  --paper:#F6F6F2; --well:#EEEEE8; --field:#FBFBF9;
  --ink:#16181D; --ink2:#3B3E45; --muted:#5F626A; --faint:#A3A49E;
  --rule:#D6D6CF; --rule2:#E4E4DE;
  --seal:#22385A;               /* verified: deep notary ink, carried by a filled seal */
  --fail:#AE402A;               /* failure: desaturated vermilion, carried by a hollow ring + dashed line */
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"Plex Mono",ui-monospace,Consolas,monospace;
  --r-ctl:3px; --r-well:2px;    /* small, square-ish controls; circles only where they carry meaning (diagram) */
  --ease:cubic-bezier(.22,.7,.18,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink2);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--rule)}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:1.5px solid var(--seal);outline-offset:3px;border-radius:var(--r-ctl)}
button{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:76px 28px 176px}
.top{display:flex;align-items:baseline;margin:0 0 64px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
h1{font:500 21px/1 var(--serif);letter-spacing:-.01em;margin:0;color:var(--ink);flex:1}
h1 b{font-weight:500}
h1 span,h1 b+*{color:var(--ink2)}
.file{font:400 13px var(--sans);color:var(--muted);cursor:pointer;border:0;background:none;padding:2px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.file:hover{color:var(--ink);text-decoration-color:var(--ink)}
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:48px}
.chip{font-size:14px;color:var(--muted);cursor:pointer;align-self:flex-start}
.chip::before{content:"→";display:inline-block;width:1.3em;color:var(--faint);transition:transform .2s var(--ease)}
.chip:hover{color:var(--ink)}.chip:hover::before{transform:translateX(2px);color:var(--ink)}
.turn{margin-bottom:84px}
.q{font-size:14px;color:var(--muted);margin-bottom:12px}
.a{font:400 36px/1.14 var(--serif);font-optical-sizing:auto;letter-spacing:-.018em;color:var(--ink);margin:0 0 20px}
.a.idk{color:var(--muted);font-style:italic}
.loading{display:inline-flex;gap:5px;padding:18px 0}
.loading i{width:5px;height:5px;background:var(--faint);animation:blink 1.1s steps(1) infinite}
.loading i:nth-child(2){animation-delay:.18s}.loading i:nth-child(3){animation-delay:.36s}
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-top:2px}
.cite{font:500 12.5px var(--mono);color:var(--ink2);cursor:pointer;letter-spacing:.02em;border-bottom:1px solid var(--rule);padding:0 1px 1px}
.cite:hover{color:var(--ink);border-color:var(--ink)}
.cite.on{color:var(--seal);border-bottom-color:var(--seal)}
.sp{flex:1}
.btn{font:500 13px/1 var(--sans);letter-spacing:.01em;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:var(--r-ctl);padding:8px 15px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--seal);border-color:var(--seal)}
.icon{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;display:inline-flex;align-items:center;font:400 13px var(--sans)}
.icon:hover{color:var(--ink)}
.menu{display:none;gap:0;font-size:13px;color:var(--muted)}
.menu.on{display:inline-flex}
.menu span{cursor:pointer;padding:0 8px;border-left:1px solid var(--rule)}
.menu span:first-child{border-left:0}
.menu span:hover{color:var(--fail)}
.ptext{font:400 16px/1.6 var(--serif);color:var(--ink2);margin:20px 0 0;padding-left:16px;border-left:1px solid var(--ink);white-space:pre-wrap;max-width:62ch}

/* ---------- diagram ---------- */
.flow{margin-top:40px;display:flex;align-items:center}
.col{display:flex;flex-direction:column;gap:16px;align-items:center}
.link{flex:1;height:1px;background:var(--rule2);min-width:18px;position:relative;overflow:hidden}
.link::after{content:"";position:absolute;inset:0;background:var(--seal);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.link.ok::after{transform:scaleX(1)}
.link.bad{background:none}
.link.bad::after{background:repeating-linear-gradient(90deg,var(--fail) 0 4px,transparent 4px 8px);transform:scaleX(1)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:86px;padding:6px 0 4px;border-radius:var(--r-ctl);border:1px solid transparent;background:none}
.node.wide{width:156px}
.node:hover .lbl{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.node.sel{border-color:var(--rule)}
.g{width:34px;height:34px;overflow:visible}
.g .ring{fill:var(--paper);stroke:var(--faint);stroke-width:1}
.node.wait .g .ring{stroke-dasharray:2 3.2;animation:spin 3.2s linear infinite;transform-origin:17px 17px}
.node.ok .g .ring{fill:var(--seal);stroke:var(--seal)}
.node.bad .g .ring{fill:var(--paper);stroke:var(--fail);stroke-width:1.5}
.g .mk{fill:none;stroke-width:1.7;stroke-linecap:square;stroke-linejoin:miter;stroke-dasharray:32;stroke-dashoffset:32;transition:stroke-dashoffset .42s var(--ease) .08s}
.node.ok .g .mk{stroke:var(--paper)}
.node.bad .g .mk{stroke:var(--fail);stroke-width:1.6}
.node.ok .g .mk,.node.bad .g .mk{stroke-dashoffset:0}
.lbl{font:500 12.5px/1.2 var(--sans);color:var(--ink)}
.sub{font:400 11.5px/1.2 var(--sans);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.node.bad .sub{color:var(--fail)}
.why{margin-top:28px;font:500 14px/1.4 var(--sans);color:var(--fail);min-height:20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.why.okk{color:var(--seal)}
.why svg{flex:none}
.how{font:400 12px/1.5 var(--sans);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.tag{font:400 12px var(--sans);color:var(--fail);border:1px solid currentColor;border-radius:var(--r-ctl);padding:0 6px;line-height:18px}

/* ---------- evidence panel ---------- */
.det{margin-top:26px;border-top:1px solid var(--ink);padding-top:4px;font-size:13px}
.det h4{display:flex;align-items:center;gap:12px;font:500 12.5px var(--sans);color:var(--ink);margin:22px 0 10px}
.det h4::after{content:"";flex:1;height:1px;background:var(--rule2)}
.det h4 small{font:400 12px var(--sans);color:var(--muted)}
.ck{display:grid;grid-template-columns:16px 1fr;gap:0 6px;padding:2px 0;color:var(--ink2);font-size:13px;line-height:1.5}
.ck i{width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--seal)}
.ck.bad i{background:none;border:1.5px solid var(--fail);width:8px;height:8px;margin-top:6.5px}
.ck.bad{color:var(--fail)}
.ck .d{color:var(--muted)}
.ck.skip i{background:none;border:1px dashed var(--muted);width:8px;height:8px;margin-top:6.5px}
.ck.skip{color:var(--muted)}
.hint{font:400 12px/1.5 var(--sans);color:var(--muted);margin-top:2px}
.hint::before{content:"↳ ";color:var(--faint)}
.hint:empty{display:none}
.kv.path{grid-template-columns:78px 1fr}
.rk{display:grid;grid-template-columns:28px minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr);gap:0 14px;font:400 12px/1.85 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);border-top:1px solid var(--rule2);margin-top:4px}
.rk>span{border-bottom:1px solid var(--rule2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .th{font:400 11.5px/2 var(--sans);color:var(--muted)}
.rk .n,.rk .s{color:var(--muted)}
.rk .ok{color:var(--seal);font-family:var(--sans)}
.rk .bad{color:var(--fail);font-family:var(--sans);font-weight:500}
.more{font:400 12px var(--sans);color:var(--muted);margin-top:6px}
.ev{margin:0 0 14px}
.ev .hd{display:flex;align-items:baseline;gap:10px;color:var(--ink2);font-size:13px;margin-bottom:3px}
.verdict{margin-left:auto;font:500 12px var(--sans);white-space:nowrap}
.verdict.ok{color:var(--seal)}.verdict.bad{color:var(--fail)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:1px 14px;font:400 12px/1.65 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.kv>.k{font:400 11.5px/1.75 var(--sans);color:var(--muted);text-align:right}
.kv>.v{word-break:break-all}
.hx span{margin-right:.42em}.hx span:last-child{margin-right:0}
.hx b{font-weight:500;color:var(--fail);text-decoration:underline;text-underline-offset:2px}
.kv .note{font:400 12px var(--sans);color:var(--muted)}
.cmdline{display:flex;gap:10px;align-items:baseline}
.cmdline code{flex:1;font:400 12px/1.6 var(--mono);color:var(--ink2);word-break:break-all}
.cmdline code::before{content:"$ ";color:var(--faint)}
.copy{font:400 12px var(--sans);color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule);white-space:nowrap}
.copy:hover{color:var(--ink);text-decoration-color:var(--ink)}
.rpcs{border-top:1px solid var(--rule2)}
.rpc{border-bottom:1px solid var(--rule2)}
.rpc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px auto 1fr 56px 14px;gap:12px;align-items:baseline;padding:8px 0;font:400 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.rpc summary::-webkit-details-marker{display:none}
.rpc summary .n{color:var(--faint)}
.rpc summary .s{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpc summary .ms{color:var(--muted);text-align:right}
.rpc summary .t{color:var(--muted);text-align:center;font-family:var(--sans)}
.rpc summary .t::before{content:"+"}
.rpc[open] summary .t::before{content:"\2212"}
.rpc summary:hover .m{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.rpc .x{display:grid;grid-template-columns:78px 1fr;gap:10px 14px;padding:4px 0 16px}
.rpc .x>.k{font:400 11.5px/1.9 var(--sans);color:var(--muted);text-align:right}
.rpc pre{margin:0;max-height:190px;overflow:auto;background:var(--well);border-radius:var(--r-well);padding:9px 12px;font:400 11.5px/1.6 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2);white-space:pre-wrap;word-break:break-all;scrollbar-width:thin}
.rpc .cast{border:1px solid var(--rule);border-radius:var(--r-well);padding:8px 12px}
.ask{position:fixed;left:0;right:0;bottom:0;padding:16px 28px 24px;background:var(--paper);border-top:1px solid var(--rule2)}
.ask form{max-width:780px;margin:0 auto;position:relative}
.ask input{width:100%;font:400 16px var(--sans);color:var(--ink);padding:13px 56px 13px 16px;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--field);outline:none;transition:border-color .15s}
.ask input::placeholder{color:var(--muted)}
.ask input:focus{border-color:var(--ink)}
.ask button{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:var(--r-ctl);border:0;background:var(--ink);color:var(--paper);cursor:pointer;display:grid;place-items:center;transition:background .15s}
.ask button:hover{background:var(--seal)}
.ask button:disabled{opacity:.35}
.err{color:var(--fail);font-size:13.5px}
.drop{position:fixed;inset:14px;background:rgba(246,246,242,.94);display:none;place-items:center;font:400 22px var(--serif);color:var(--ink);z-index:9;border:1px solid var(--ink);border-radius:var(--r-ctl)}
.drop.on{display:grid}
.zone{border:1px dashed var(--rule);border-radius:var(--r-ctl);padding:56px 24px;text-align:center;color:var(--ink2);cursor:pointer;font:400 19px/1.4 var(--serif);transition:border-color .15s}
.zone:hover{border-color:var(--ink)}
.zone .how{font-family:var(--sans)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><b>Verify</b> an answer</h1></div>
  <div class="zone" id="zone">Drop an answer bundle (.json) here, or click to choose a file
    <div class="how" style="margin-top:8px">runs entirely in this page · talks only to rpc.testnet.arc.io · replay files from raw.githubusercontent.com, hash-checked</div></div>
  <div id="thread" style="margin-top:48px"></div>
</div>
<div class="drop" id="drop">Drop to verify</div>

  // ---------- canonical JSON exactly like Python json.dumps(sort_keys, (",",":"), ensure_ascii=False) ----------

  // ---------- cast / explorer helpers ----------
  function castFor(method, params, rpc) {

    if (method === "eth_getCode") return `cast code ${params[0]}${R}`;
    if (method === "eth_getTransactionByHash") return `cast tx ${params[0]}${R}`;
    if (method === "eth_getTransactionReceipt") return `cast receipt ${params[0]}${R}`;
    if (method === "eth_getBlockByNumber") return `cast block ${parseInt(params[0], 16)}${R}`;

      if (r.error) { h += `<div class="ev"><div class="hd">could not fetch the committed corpus from ${esc(new URL(r.uri).host)}<span class="verdict bad">not run</span></div><div class="kv"><span class="k">run locally</span><span class="v">${cmdRow("python verify_citations.py bundle.json")}</span></div></div>`; continue; }
      const src = r.uri.match(/github(?:usercontent)?\.com\/([^/]+\/[^/]+)\/([0-9a-f]{7})/);
      h += `<div class="ev"><div class="kv">${(r.arts || []).map((a) => `<span class="k">${esc(a.name.replace("retriever code", "code").replace("model weights", "weights"))}</span><span class="v"><a target="_blank" rel="noopener" href="${esc(a.url)}">${esc(a.url.split("/").pop())}</a> <span class="note">· ${mb(a.bytes)} · sha256 ${short(a.sha256)} ${a.ok ? "≡ committed" : "≠ committed"}</span></span>`).join("")}
        <span class="k">source</span><span class="v note">${src ? `${esc(src[1])} @ ${esc(src[2])}, pinned by the on-chain URI` : esc(r.uri)}</span></div></div>`;
      if (r.rows) { const show = r.rows.filter((x, i) => i < 8 || !x.same);
        h += `<div class="ev"><div class="hd">${r.rows.length} candidates · ${r.ms} ms<span class="verdict ${r.ok ? "ok" : "bad"}">${r.ok ? "≡ identical ranking" : "≠ ranking differs"}</span></div><div class="rk">
          <span class="th">#</span><span class="th">replayed</span><span class="th">bm25 · dense</span><span class="th">in the answer</span>` +
          show.map((x) => `<span class="n">${x.rank}</span><span class="v">${short(x.id)}</span><span class="s">${x.replay.bm25 ?? "–"} · ${x.replay.dense ?? "–"}</span><span class="${x.same ? "ok" : "bad"}">${x.same ? "≡ same" : (r.missing.includes(x.id) ? "omitted" : short((x.committed || {}).id || "—"))}</span>`).join("") +
          `</div>${r.rows.length > show.length ? `<div class="more">+ ${r.rows.length - show.length} more, all identical</div>` : ""}</div>`; }
    }
    return h;
  }

  // ---------- verify (in the browser) ----------
  function nodeHTML(n) { return `<div class="node wait${n.wide ? " wide" : ""}" data-k="${n.k}" title="click for evidence"><svg class="g" viewBox="0 0 34 34" aria-hidden="true"><circle class="ring" cx="17" cy="17" r="15.5"/><path class="mk"/></svg><div class="lbl">${esc(n.lbl)}</div><div class="sub">${esc(n.sub)}</div></div>`; }
  async function verify(body, b, tampered) {
    body.querySelector(".ptx").innerHTML = "";
    const vf = body.querySelector(".vf"), cols0 = build(b, null);
    vf.innerHTML = `<div class="flow">${cols0.map((c, i) => (i ? `<div class="link" data-l="${i}"></div>` : "") + `<div class="col">${c.map(nodeHTML).join("")}</div>`).join("")}</div>
      <div class="why"></div><div class="how"></div><div class="hint"></div><div class="det"></div>`;
    vf.querySelector(".det").style.display = "none";
    const t0 = performance.now(); let v;
    const how = vf.querySelector(".how");
    try { v = await A().verifyBundle(b, { onStatus: (m) => (how.textContent = b.retrieval ? `replaying retrieval · ${m} from the committed URI…` : "") }); }
    catch (e) { vf.querySelector(".why").textContent = "could not reach the Arc RPC from your browser: " + e.message;
      vf.querySelector(".how").textContent = "verify offline-of-us instead: python verify_citations.py bundle.json  (or the cast commands in the README)"; return; }
    const mine = location.origin && location.origin !== "null"
      ? performance.getEntriesByType("resource").filter((e) => e.startTime >= t0 && new URL(e.name).origin === location.origin).length : 0;
    const cols = build(b, v), byk = Object.fromEntries(cols.flat().map((n) => [n.k, n])), det = vf.querySelector(".det");
    vf.querySelectorAll(".node").forEach((el) => (el.onclick = () => {
      const same = det.dataset.k === el.dataset.k && det.style.display !== "none";
      vf.querySelectorAll(".node").forEach((o) => o.classList.remove("sel"));
      if (same) { det.style.display = "none"; det.dataset.k = ""; return; }
      el.classList.add("sel"); det.dataset.k = el.dataset.k; det.style.display = ""; det.innerHTML = evidenceHTML(byk[el.dataset.k], v);
      det.querySelectorAll("[data-copy]").forEach((c) => (c.onclick = (e) => { e.preventDefault(); navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy); c.textContent = "copied"; setTimeout(() => (c.textContent = "copy"), 1200); }));
    }));
    let bad = null;
    for (let i = 0; i < cols.length; i++) {
      if (i) { vf.querySelector(`[data-l="${i}"]`).classList.add(cols[i - 1].every((n) => n.ok) ? "ok" : "bad"); await sleep(300); }
      for (const n of cols[i]) { const el = vf.querySelector(`[data-k="${n.k}"]`); el.classList.remove("wait"); el.classList.add(n.ok ? "ok" : "bad");
        el.querySelector(".mk").setAttribute("d", n.ok ? MARK.ok : MARK.bad); el.setAttribute("aria-label", `${n.lbl}: ${n.ok ? "verified" : "failed"}`);
        if (!n.ok && n.src) el.querySelector(".sub").textContent = "not verified";
        if (n.k === "m") el.querySelector(".sub").textContent = n.sub;
        if (n.k === "c" && n.skipped) el.querySelector(".sub").textContent = "replay: run locally";
        if (!n.ok && !bad) bad = n; await sleep(200); }
    }
    const why = vf.querySelector(".why");
    if (bad) { why.className = "why"; why.innerHTML = SEAL(false) + `<span>${esc(bad.why)}</span>` + (tampered ? `<span class="tag">tampered ${esc(b._t || "copy")}</span>` : ""); }
    else { why.className = "why okk"; why.innerHTML = SEAL(true) + `<span>${v.all_pass ? "Verified on Arc" : "Model call verified · no sources were cited"}</span>`; }
    vf.querySelector(".hint").textContent = "Click a node to see the on-chain evidence.";
    G.__lastVerify = v;
    vf.querySelector(".how").textContent = `Checked in your browser, directly against ${new URL(v.rpc).host}: ${v.rpc_calls} RPC calls, ${mine} to our server${b.retrieval ? `; replay files from ${(v.evidence.corpus || []).some((x) => x.kind === "replay" && x.arts) ? "raw.githubusercontent.com, sha256-checked" : "—"}` : ""}.`;
    return v;
  }

  // ---------- open a bundle file ----------
  function loadBundle(thread, file, onDone) {
    const r = new FileReader();
    r.onload = async () => { let b; const t = newTurn(thread, file.name);
      try { b = JSON.parse(r.result); if (!b.contract || !Array.isArray(b.citations)) throw new Error("not an answer bundle"); }
      catch (e) { t.querySelector(".body").innerHTML = `<div class="err">${esc(file.name)}: ${esc(e.message)}</div>`; return; }
      t.querySelector(".q").textContent = b.question || file.name;
      const body = render(t, b, { download: false }); const v = await verify(body, b, false); if (onDone) onDone(v); };
    r.readAsText(file);
  }
  function initFileInput(thread, button, dropEl) {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json"; inp.style.display = "none"; document.body.appendChild(inp);
    inp.onchange = () => { if (inp.files[0]) loadBundle(thread, inp.files[0]); inp.value = ""; };
    if (button) button.onclick = () => inp.click();
    let depth = 0;
    addEventListener("dragenter", (e) => { e.preventDefault(); depth++; dropEl.classList.add("on"); });
    addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; dropEl.classList.remove("on"); } });
    addEventListener("dragover", (e) => e.preventDefault());
    addEventListener("drop", (e) => { e.preventDefault(); depth = 0; dropEl.classList.remove("on"); const f = e.dataTransfer.files[0]; if (f) loadBundle(thread, f); });
    return inp;
  }

  G.VUI = { newTurn, render, verify, loadBundle, initFileInput, esc };
})(globalThis);

</script>
<script>
VUI.initFileInput(document.getElementById("thread"), document.getElementById("zone"), document.getElementById("drop"));
</script>
</body>
</html>
